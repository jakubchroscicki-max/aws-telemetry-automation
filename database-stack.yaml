AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudOps Enterprise - Production Database Tier for Core Telemetry Storage (PostgreSQL)'

Parameters:
  NetworkStackName:
    Type: String
    Default: 'KubaNetworkCore'
    Description: 'Name of the base network stack to import active VPC and Subnet IDs'

Resources:
  PostgresDatabaseSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'BANK-LIVE-DB: Restrict inbound access strictly to PostgreSQL port 5432'
      VpcId: 
        Fn::ImportValue: !Sub '${NetworkStackName}-VPC-ID'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16 
      Tags:
        - Key: Name
          Value: Bank-Prod-Postgres-SG

  RdsDbSubnetGroup:
    Type: 'AWS::RDS::DBSubnetGroup'
    Properties:
      DBSubnetGroupDescription: 'Isolated subnets deployment group for banking database engine'
      SubnetIds:
        - Fn::ImportValue: !Sub '${NetworkStackName}-PUB-SUBNET'
        - Fn::ImportValue: !Sub '${NetworkStackName}-PRIV-SUBNET'
      Tags:
        - Key: Name
          Value: Bank-Prod-DB-SubnetGroup

  KubaPostgresInstance:
    Type: 'AWS::RDS::DBInstance'
    Properties:
      AllocatedStorage: '20'
      DBInstanceClass: 'db.t4g.micro'
      Engine: 'postgres'
      EngineVersion: '16'
      MasterUsername: 'kuba_admin'
      MasterUserPassword: 'SecureTelemetryPassword2026!'
      DBSubnetGroupName: !Ref RdsDbSubnetGroup
      VPCSecurityGroups:
        - !GetAtt PostgresDatabaseSecurityGroup.GroupId
      StorageEncrypted: true
      BackupRetentionPeriod: 0
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: Bank-Prod-Core-PostgreSQL

Outputs:
  DatabaseEndpoint:
    Description: 'Connection endpoint for the live telemetry collection database'
    Value: !GetAtt KubaPostgresInstance.Endpoint.Address
    Export:
      Name: !Sub '${AWS::StackName}-DB-Endpoint'
