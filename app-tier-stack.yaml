AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudOps Enterprise - Compute Infrastructure Tier for Telemetry Ingestion Engine (Amazon EC2 Linux)'

Parameters:
  NetworkStackName:
    Type: String
    Default: 'KubaNetworkCore'
    Description: 'Name of the baseline network stack to pull structural VPC and Subnet outputs'

Resources:
  # 1. Stateful Firewall (Security Group) protecting the Ingestion Node
  AppServerSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'BANK-LIVE-APP: Protect ingestion endpoints, allowing standard secure web ports'
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VPC-ID'
      SecurityGroupIngress:
        # Inbound Boundary: Allow incoming telemetry traffic on secure HTTPS port 443
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Bank-Prod-AppServer-SG

  # 2. Main Linux Instance running on cost-efficient AWS Graviton2 architecture
  KubaAppInstance:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: 't4g.micro' # Highly cost-effective ARM64 compute tier matching performance credits
      # Official Amazon Linux 2023 AMI tailored for system automation (eu-north-1 specific)
      ImageId: 'ami-09a805a41ef115fa0' 
      SubnetId:
        Fn::ImportValue: !Sub '${NetworkStackName}-PUB-SUBNET'
      SecurityGroupIds:
        - !GetAtt AppServerSecurityGroup.GroupId
      # Automated UserData Bootstrap Script: Executed immediately upon infrastructure instantiation
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo "=================================================="
          echo "Initializing Automated Banking Telemetry Daemon"
          echo "=================================================="
          yum update -y
          yum install -y postgresql16
          echo "Telemetry Ingestion Layer Active." > /var/log/telemetry_status.log
      Tags:
        - Key: Name
          Value: Bank-Prod-Core-AppServer

Outputs:
  AppServerPublicIP:
    Description: 'Public IP footprint for remote banking application data ingestion streams'
    Value: !GetAtt KubaAppInstance.PublicIp
    Export:
      Name: !Sub '${AWS::StackName}-App-Public-IP'
