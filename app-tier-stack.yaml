AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudOps Enterprise - Compute Infrastructure Tier for Telemetry Ingestion Engine (Amazon EC2 ARM64 Linux)'

Parameters:
  NetworkStackName:
    Type: String
    Default: 'KubaNetworkCore'
    Description: 'Name of the baseline network stack to pull structural VPC and Subnet outputs'

Resources:
  # 1. Stateful Firewall (Security Group) protecting the Ingestion Node
  AppServerSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'BANK-LIVE-APP: Protect ingestion endpoints, allowing standard secure web ports'
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VPC-ID'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Bank-Prod-AppServer-SG

  # 2. Main Linux Instance running on cost-efficient AWS Graviton2 architecture (ARM64)
  KubaAppInstance:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: 't4g.micro' # Pure ARM64 CPU architecture
      # Official Amazon Linux 2023 AMI dynamically mapped SPECIFICALLY for ARM64 kernel
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
      SubnetId:
        Fn::ImportValue: !Sub '${NetworkStackName}-PUB-SUBNET'
      SecurityGroupIds:
        - !GetAtt AppServerSecurityGroup.GroupId
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y postgresql16
          echo "Telemetry Ingestion Layer Active." > /var/log/telemetry_status.log
      Tags:
        - Key: Name
          Value: Bank-Prod-Core-AppServer

Outputs:
  AppServerPublicIP:
    Description: 'Public IP footprint for remote banking application data ingestion streams'
    Value: !GetAtt KubaAppInstance.PublicIp
    Export:
      Name: !Sub '${AWS::StackName}-App-Public-IP'
