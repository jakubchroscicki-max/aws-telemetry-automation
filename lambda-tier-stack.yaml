AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lambda Web App for AWS Reward'

Resources:
  WebLambda:
    Type: 'AWS::Lambda::Function'
    Properties:
      FunctionName: 'CloudOps-WebApp-Reward'
      Handler: 'index.lambda_handler'
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      Runtime: 'python3.11'
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {'statusCode': 200, 'headers': {'Content-Type': 'text/html'}, 'body': '<h1>Sukces</h1>'}

  WebLambdaUrl:
    Type: 'AWS::Lambda::Url'
    Properties:
      TargetFunctionArn: !Ref WebLambda
      AuthType: 'NONE'

  WebLambdaPermission:
    Type: 'AWS::Lambda::Permission'
    Properties:
      FunctionName: !Ref WebLambda
      Action: 'lambda:InvokeFunctionUrl'
      Principal: '*'
      FunctionUrlAuthType: 'NONE'
